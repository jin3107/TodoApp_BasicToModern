name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test TodoApp.Server/src/src.sln --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TodoApp.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TodoApp.Client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    # Catches Dockerfile breakage (e.g. wrong Node version) before a release tag does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./TodoApp.Server/src
          file: ./TodoApp.Server/src/Todo.API/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./TodoApp.Client
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
