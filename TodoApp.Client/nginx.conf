# Browser page loads send Accept: text/html and must get the SPA;
# axios calls do not, and are proxied to the API. Needed because
# /todo-lists and /reports are both SPA routes and API prefixes.
map $http_accept $wants_html {
    default 0;
    ~*text/html 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Resolve the backend lazily via Docker's embedded DNS so nginx still starts
    # when the backend is not up yet and follows it if its IP changes.
    resolver 127.0.0.11 valid=10s;

    location ~ ^/(authentication|reports|todo-items|todo-lists) {
        if ($wants_html) {
            rewrite ^ /index.html last;
        }
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
